# X-Launcher — preset "Filtro CRT" per RetroArch (Step 19a, richiesta utente)
#
# Applicato tramite --appendconfig=<questo file> nel campo Launch Arguments
# del Game Config (pulsante "Filtro CRT" nell'overlay, per giochi RetroArch).
#
# crt-easymode.slangp è bundled con il pacchetto libretro-shaders-slang su
# Arch — leggero e ampiamente raccomandato come default CRT, verificato
# sull'elenco file reale del pacchetto (non un percorso indovinato). Se
# preferisci un altro shader fra quelli già installati sul tuo sistema,
# modifica solo la riga video_shader qui sotto — non serve toccare nient'altro,
# X-Launcher continuerà ad applicare questo stesso file.
video_shader_enable = "true"
video_shader = "/usr/share/libretro/shaders/shaders_slang/crt/crt-easymode.slangp"
